###启动模式，standalone：独立模式；webapp：在web server容器中启动（通过自启动的servlet）###
###之所以设置两种启动模式，是为了避免应用启动的类加载器和web server容器内的类加载器不一致导致的各种问题###
###两个模式的值standalone、webapp不区分大小写###
###该配置项已被启用（框架自动判断启动模式）###
StartupMode=webapp

#是否已jar包部署：true/false，如设为true，则不扫描{ClassPath}
deployAsJar=true

#是否禁用在线用户处理模块
disableOnlines=true

###兼容性设置###
###是否依赖session
SessionRequired=true

###关键路径###
#AppRoot即JFRAMEWORK_HOME#
AppRoot=USER_DIR
ClassPath=USER_DIR/target/classes
ConfigPath=USER_DIR/data/config
WebRoot=USER_DIR/src/main/webapp
JDFSPath=USER_DIR/src/main/webapp
DataPath=USER_DIR/data
#I18NPath=
JspPath=USER_DIR/jshop
UserDir=USER_DIR

###应用配置参数存储方式###
#DB: 数据库，XML：xml文件，不区分大小写
AppConfigMethod=XML

#系统UUID（JVM内），不设置则每次启动系统时自动生成（不固定）
RunTimeUUID=jframework000

#本机IP
MachineIp=127.0.0.1